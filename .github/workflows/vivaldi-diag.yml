name: vivaldi-diag
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow
      - run: python build.py
      - name: Install Vivaldi
        run: |
          curl -fsSL https://repo.vivaldi.com/archive/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/vivaldi.gpg
          echo "deb [signed-by=/usr/share/keyrings/vivaldi.gpg] https://repo.vivaldi.com/archive/deb/ stable main" | sudo tee /etc/apt/sources.list.d/vivaldi.list
          for i in 1 2 3 4; do sudo apt-get update && sudo apt-get install -y vivaldi-stable xvfb && break; sleep 20; done
      - name: H - metode de creare tinte
        env: { BROWSER_EXE: /usr/bin/vivaldi-stable, BROWSER_CDP: '1', HEADED: '1' }
        working-directory: test
        run: VIVALDI_FALLBACK=0 timeout 170 xvfb-run -a python -u -c "import bt,runpy;runpy.run_path('viv_diag3.py',run_name='__main__')" > /tmp/h.txt 2>&1 || true; cut -c1-900 /tmp/h.txt | grep -v dbus | tail -30
        continue-on-error: true
