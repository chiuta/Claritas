name: safari-dev
on:
  push: { branches: [ci/safari] }
jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install selenium && python build.py
      - name: Build + register
        run: |
          xcrun safari-web-extension-converter dist/safari --project-location /tmp/saf --app-name Claritas --no-open --no-prompt --macos-only --force 2>&1 | tail -3
          cd /tmp/saf/Claritas
          xcodebuild -scheme Claritas -configuration Debug CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO build > /tmp/xb.log 2>&1 || true
          grep -E "\*\* BUILD" /tmp/xb.log
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Debug/Claritas.app" -maxdepth 6 | head -1)
          mkdir -p ~/Applications && cp -R "$APP" ~/Applications/ && open ~/Applications/Claritas.app && sleep 6 || true
          ID=com.yourCompany.Claritas.Extension
          pluginkit -a ~/Applications/Claritas.app/Contents/PlugIns/*.appex || true
          pluginkit -e use -i $ID; pluginkit -mAvv -p com.apple.Safari.web-extension | grep -B1 -A6 -i claritas | head -14
          sudo safaridriver --enable || true
      - name: UI scripting
        continue-on-error: true
        run: |
          mkdir -p test/results
          sudo dscl . -passwd /Users/runner 'Cl4ritas-CI-9x' || true
          osascript -e 'tell application "Safari" to quit' 2>/dev/null || true; sleep 2
          open -a Safari; sleep 7
          cat > /tmp/ui.applescript <<'AS'
          on procWins()
            tell application "System Events"
              set r to ""
              repeat with p in (every process whose visible is true or background only is false)
                try
                  set r to r & (name of p) & "[" & (count of windows of p) & "] "
                end try
              end repeat
              try
                tell process "SecurityAgent"
                  set r to r & linefeed & "SA: " & my dumpSA()
                end tell
              end try
              return r
            end tell
          end procWins
          on dumpSA()
            tell application "System Events"
              try
                tell process "SecurityAgent"
                  return (name of every window as string) & linefeed & my dump(window 1, 0, 5)
                end tell
              on error e
                return "SA error " & e
              end try
            end tell
          end dumpSA
          on findAll(el, rl)
            tell application "System Events"
              set res to {}
              try
                set kids to UI elements of el
              on error
                return {}
              end try
              repeat with k in kids
                try
                  if (role of k) is rl then set end of res to contents of k
                end try
                set res to res & my findAll(k, rl)
              end repeat
              return res
            end tell
          end findAll
          on dump(el, depth, maxd)
            tell application "System Events"
              set out to ""
              try
                set kids to UI elements of el
              on error
                return ""
              end try
              repeat with k in kids
                set nm to ""
                set rl to ""
                try
                  set rl to role of k
                end try
                try
                  set nm to name of k
                end try
                if nm is missing value then set nm to ""
                set dsc to ""
                try
                  set dsc to description of k
                end try
                set out to out & (do shell script "printf '%*s' " & (depth * 2) & " ''") & rl & " | " & nm & " | " & dsc & linefeed
                if depth < maxd then set out to out & my dump(k, depth + 1, maxd)
              end repeat
              return out
            end tell
          end dump
          tell application "System Events"
            tell process "Safari"
              set frontmost to true
              delay 1
              keystroke "," using command down
              repeat 15 times
                if (count of windows) > 0 then exit repeat
                delay 1
              end repeat
              delay 2
              click button "Advanced" of toolbar 1 of window 1
              delay 2
              try
                set c to checkbox "Show features for web developers" of group 1 of group 1 of window 1
                log "devcheck before: " & (value of c)
                if (value of c) is 0 then click c
                delay 2
                log "devcheck after: " & (value of c)
              on error e
                log "ERR devcheck " & e
              end try
              try
                click button "Developer" of toolbar 1 of window 1
                delay 2
                log "=== DEV UI"
                log my dump(window 1, 0, 6)
                set cbs to my findAll(window 1, "AXCheckBox")
                repeat with c in cbs
                  try
                    if (name of c) contains "nsigned" then
                      log "unsigned cb before: " & (value of c)
                      if (value of c) is 0 then click c
                      delay 4
                      delay 3
                      repeat with pw in {"admin", "anka", "Anka", "runner", "password", "ci", "1234", "github", "actions"}
                        try
                          if (count of sheets of window 1) > 0 then
                            set focused of text field 1 of sheet 1 of window 1 to true
                            delay 0.5
                            keystroke "a" using command down
                            keystroke (contents of pw)
                            delay 1
                            keystroke return
                            delay 3
                            log "tried password " & (contents of pw) & " -> sheets: " & (count of sheets of window 1)
                            if (count of sheets of window 1) is 0 then exit repeat
                          end if
                        on error e4
                          log "pw error " & e4
                        end try
                      end repeat
                      log "unsigned cb final: " & (value of c)
                      log "windows now: " & (name of every window as string)
                    end if
                  end try
                end repeat
                log "=== add temporary extension"
                click button "Add Temporary Extension…" of group 1 of group 1 of window 1
                delay 3
                keystroke "g" using {command down, shift down}
                delay 2
                keystroke "__EXTDIR__"
                delay 1
                keystroke return
                delay 2
                keystroke return
                delay 5
                log "windows after temp ext: " & (name of every window as string)
                log my dump(window 1, 0, 3)
              on error e
                log "ERR developer " & e
              end try
              try
                click button "Extensions" of toolbar 1 of window 1
              on error e
                log "ERR ext " & e
              end try
              delay 3
              log "=== EXT UI"
              log my dump(window 1, 0, 9)
            end tell
          end tell
          AS
          sed -i '' "s#__EXTDIR__#$GITHUB_WORKSPACE/dist/safari#" /tmp/ui.applescript
          osascript /tmp/ui.applescript 2>&1 | head -150
          screencapture -x test/results/safari-ext.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-safari-dev, path: test/results }
