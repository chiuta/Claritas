name: contrast-benchmark
# Benchmark public de contrast: pagini reale, cu și fără Claritas (măsurătoare independentă de motor). Pornire manuală.
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  bench:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: latest }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Chrome for Testing (acceptă --load-extension)
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path /tmp/cft | tee /tmp/cft.txt
          echo "CHROME_PATH=$(tail -1 /tmp/cft.txt | sed -E 's/^[^ ]+ //')" >> $GITHUB_ENV
      - run: pip install playwright && sudo apt-get update && sudo apt-get install -y xvfb
      - run: python3 build.py
      - run: npm install --no-save axe-core
      - name: Benchmark
        run: xvfb-run -a python3 tools/contrast_benchmark.py --axe node_modules/axe-core/axe.min.js --out contrast_benchmark.json 2>&1 | tee bench.log
      - name: Rezumat
        if: always()
        run: |
          echo '### Benchmark contrast' >> $GITHUB_STEP_SUMMARY
          grep '^REZUMAT' bench.log | sed 's/^REZUMAT //' | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); [print(f'- {k}: {v}') for k,v in d.items()]" >> $GITHUB_STEP_SUMMARY
          cat contrast_benchmark.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrast-benchmark
          path: |
            contrast_benchmark.json
            contrast_benchmark.md
