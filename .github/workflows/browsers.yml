name: browsers
on:
  push:
    branches: [main, 'ci/browser-matrix']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 build.py
      - name: web-ext lint (chromium + firefox)
        run: |
          mkdir -p test/results
          { npx --yes web-ext lint -s dist/firefox 2>&1 | tail -15; } | tee test/results/lint-firefox.txt
          { npx --yes web-ext lint -s dist/chromium 2>&1 | tail -15; } | tee test/results/lint-chromium.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: r-lint, path: test/results }

  chromium-family:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  browser: msedge }
          - { os: ubuntu-latest,  browser: chromium }
          - { os: ubuntu-latest,  browser: brave }
          - { os: ubuntu-latest,  browser: vivaldi }
          - { os: ubuntu-latest,  browser: opera }
          - { os: windows-latest, browser: chromium }
          - { os: windows-latest, browser: msedge }
          - { os: macos-latest,   browser: chromium }
          - { os: macos-latest,   browser: msedge }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow imageio-ffmpeg
      - run: python build.py
      - name: Install browser (Playwright channel)
        if: ${{ !contains('brave vivaldi opera', matrix.browser) }}
        run: python -m playwright install ${{ matrix.browser == 'chromium' && 'chromium' || matrix.browser }}
      - run: python -m playwright install ffmpeg
      - name: Install Brave
        if: matrix.browser == 'brave'
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave.list
          for i in 1 2 3 4; do sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 brave-browser && break; sleep 20; done
          echo "BROWSER_EXE=/usr/bin/brave-browser" >> $GITHUB_ENV
      - name: Install Vivaldi
        if: matrix.browser == 'vivaldi'
        run: |
          curl -fsSL https://repo.vivaldi.com/archive/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/vivaldi.gpg
          echo "deb [signed-by=/usr/share/keyrings/vivaldi.gpg] https://repo.vivaldi.com/archive/deb/ stable main" | sudo tee /etc/apt/sources.list.d/vivaldi.list
          for i in 1 2 3 4; do sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 vivaldi-stable && break; sleep 20; done
          echo "BROWSER_EXE=/usr/bin/vivaldi-stable" >> $GITHUB_ENV
          echo "BROWSER_CDP=1" >> $GITHUB_ENV
      - name: Install Opera
        if: matrix.browser == 'opera'
        run: |
          curl -fsSL https://deb.opera.com/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/opera.gpg
          echo "deb [signed-by=/usr/share/keyrings/opera.gpg] https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera.list
          echo "opera-stable opera-stable/add-deb-source boolean false" | sudo debconf-set-selections
          for i in 1 2 3 4; do sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 opera-stable && break; sleep 20; done
          echo "BROWSER_EXE=/usr/bin/opera" >> $GITHUB_ENV
          echo "BROWSER_CDP=1" >> $GITHUB_ENV
      - name: Run tests (Linux, xvfb)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 30
        env:
          BROWSER_CHANNEL: ${{ matrix.browser }}
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          [ -n "$BROWSER_EXE" ] && unset BROWSER_CHANNEL
          if [ -n "$BROWSER_CDP" ]; then
            export HEADED=1
            xvfb-run -a python test/run_matrix.py "${{ matrix.os }}-${{ matrix.browser }}"
          else
            python test/run_matrix.py "${{ matrix.os }}-${{ matrix.browser }}"
          fi
      - name: Prepare tools (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -c "import os;os.makedirs('/tmp',exist_ok=True)"
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg >/dev/null 2>&1 || true; else choco install ffmpeg -y >/dev/null 2>&1 || true; fi
      - name: Run tests (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          HEADED: '1'
          BROWSER_CHANNEL: ${{ matrix.browser }}
        run: python test/run_matrix.py "${{ matrix.os }}-${{ matrix.browser }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'r-${{ matrix.os }}-${{ matrix.browser }}', path: test/results }

  firefox:
    name: ${{ matrix.os }} / firefox-${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  channel: latest }
          - { os: ubuntu-latest,  channel: latest-esr }
          - { os: ubuntu-latest,  channel: latest-beta }
          - { os: ubuntu-latest,  channel: latest-nightly }
          - { os: ubuntu-latest,  channel: latest-devedition }
          - { os: windows-latest, channel: latest }
          - { os: macos-latest,   channel: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install selenium pillow
      - run: python build.py
      - id: ff
        uses: browser-actions/setup-firefox@v1
        with: { firefox-version: '${{ matrix.channel }}' }
      - id: gd
        uses: browser-actions/setup-geckodriver@latest
      - name: Selenium test
        shell: bash
        env:
          FIREFOX_BIN: ${{ steps.ff.outputs.firefox-path }}
          GECKODRIVER: ${{ steps.gd.outputs.path }}
        run: |
          mkdir -p test/results
          cd test
          [ "$RUNNER_OS" = Linux ] && PRE="xvfb-run -a" || PRE=""
          $PRE python ff_selenium.py 2>&1 | tee results/${{ matrix.os }}-firefox-${{ matrix.channel }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'r-${{ matrix.os }}-ff-${{ matrix.channel }}', path: test/results }

  engines:
    name: ${{ matrix.os }} / engine-${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, engine: firefox }
          - { os: ubuntu-latest, engine: chromium }
          - { os: macos-latest,  engine: webkit }
          - { os: windows-latest, engine: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright
      - run: python -m playwright install ${{ matrix.engine }} 
      - run: python test/engine_shim.py ${{ matrix.engine }}

  safari-convert:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python build.py
      - name: Convert + build (unsigned)
        run: |
          mkdir -p test/results
          xcrun safari-web-extension-converter dist/safari --project-location /tmp/safari --app-name Claritas --no-open --no-prompt --macos-only --force 2>&1 | tail -30 | tee test/results/safari-convert.txt
          cd /tmp/safari/Claritas
          xcodebuild -scheme Claritas -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > /tmp/xb.log 2>&1 || true
          echo "--- ERRORS"; grep -E "error:|\*\* BUILD|Signing|requires" /tmp/xb.log | sort -u | head -20 
          echo "--- fail list"; grep -A6 "following build commands failed" /tmp/xb.log | head -12
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-safari, path: test/results }

  chrome-for-testing:
    name: ${{ matrix.os }} / chrome-${{ matrix.ch }} (Chrome for Testing)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ch: [stable, beta, dev, canary]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install playwright pillow imageio-ffmpeg && python build.py
      - name: Install Chrome for Testing (real Chrome builds that accept --load-extension)
        shell: bash
        run: |
          npx --yes @puppeteer/browsers install chrome@${{ matrix.ch }} --path /tmp/cft | tee /tmp/cft.txt
          EXE=$(tail -1 /tmp/cft.txt | sed -E 's/^[^ ]+ //'); echo "exe: $EXE"
          echo "BROWSER_EXE=$EXE" >> $GITHUB_ENV
      - name: Run tests
        shell: bash
        env: { HEADED: '1' }
        run: |
          if [ "$RUNNER_OS" = Linux ]; then unset HEADED; fi
          python -c "import os;os.makedirs('/tmp',exist_ok=True)"
          python test/run_matrix.py "cft-${{ matrix.os }}-${{ matrix.ch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'r-cft-${{ matrix.os }}-${{ matrix.ch }}', path: test/results }

  browser-profiles:
    name: profile / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [chrome-win, chrome-mac, chrome-linux, chromeos, chrome-android, edge-android, kiwi, opera, opera-gx, opera-android, vivaldi, yandex, brave, arc, whale, dark-scheme, forced-colors, reduced-motion, zoom-200]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow imageio-ffmpeg && python build.py && python -m playwright install chromium ffmpeg
      - name: Chromium cu profilul ${{ matrix.profile }} (UA, viewport, preferințe media)
        env: { BROWSER_CHANNEL: chromium, EMULATE: '${{ matrix.profile }}' }
        run: |
          T="t5_features.py t6_popup_tools.py t7_v14.py t11_lang.py t12_audit3.py"
          # în forced-colors extensia dezactivează intenționat culorile/temele (respectă contrastul impus de OS)
          [ "${{ matrix.profile }}" = forced-colors ] && T="t6_popup_tools.py t11_lang.py t12_audit3.py"
          python test/run_matrix.py "profile-${{ matrix.profile }}" $T
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'r-profile-${{ matrix.profile }}', path: test/results }

  samsung-emulation:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow imageio-ffmpeg && python build.py && python -m playwright install chromium ffmpeg
      - name: Chromium cu profil Samsung Internet (UA, 412x915, touch)
        env: { BROWSER_CHANNEL: chromium, EMULATE: samsung }
        run: python test/run_matrix.py samsung-emulation t5_features.py t6_popup_tools.py t7_v14.py t11_lang.py t12_audit3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-samsung-emulation, path: test/results }

  firefox-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install selenium && python build.py
      - uses: browser-actions/setup-geckodriver@latest
        id: gd
      - name: geckodriver path
        run: echo "GECKODRIVER=$(which geckodriver)" >> $GITHUB_ENV; geckodriver --version | head -1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download Firefox Nightly for Android (x86_64)
        run: python test/fetch_fenix.py && ls -l /tmp/fenix.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r /tmp/fenix.apk
            adb shell pm list packages | grep -i mozilla
            adb shell pm grant org.mozilla.fenix android.permission.POST_NOTIFICATIONS || true
            adb shell am set-debug-app --persistent org.mozilla.fenix || true
            python test/ff_android.py
          
  ios-ipados:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python build.py
      - name: Convert for iOS and build for Simulator (unsigned)
        run: |
          mkdir -p test/results
          xcrun safari-web-extension-converter dist/safari --project-location /tmp/ios --app-name Claritas --no-open --no-prompt --ios-only --force 2>&1 | tail -15
          cd /tmp/ios/Claritas
          xcodebuild -scheme Claritas -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > /tmp/xb.log 2>&1 || true
          grep -E "error:|\*\* BUILD" /tmp/xb.log | sort -u | head -20 | tee /tmp/xb-sum.txt
          grep -q "BUILD SUCCEEDED" /tmp/xb.log && echo "iOS build: OK" || echo "iOS build: FAIL"
      - name: Install into iPhone and iPad simulators, launch container app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/Claritas.app" -maxdepth 6 | head -1); echo "APP=$APP"
          ls "$APP/PlugIns" || true
          for kind in iPhone iPad; do
            DEV=$(xcrun simctl list devices available | grep -E "^\s+$kind" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            echo "== $kind $DEV"
            [ -z "$DEV" ] && continue
            xcrun simctl boot "$DEV" || true
            xcrun simctl bootstatus "$DEV" -b >/dev/null 2>&1 || true
            xcrun simctl install "$DEV" "$APP" && echo "$kind install: OK" || echo "$kind install: FAIL"
            BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"); echo "bundle $BID"
            xcrun simctl launch "$DEV" "$BID" && echo "$kind launch: OK" || echo "$kind launch: FAIL"
            sleep 3; xcrun simctl io "$DEV" screenshot /tmp/$kind.png || true
            xcrun simctl listapps "$DEV" | grep -iE "claritas" | head -5
          done
          mkdir -p test/results && cp /tmp/iPhone.png /tmp/iPad.png test/results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-ios, path: test/results }

  safari-real:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install selenium && python build.py
      - name: Build + register the Safari extension (ad-hoc signed)
        run: |
          xcrun safari-web-extension-converter dist/safari --project-location /tmp/saf --app-name Claritas --no-open --no-prompt --macos-only --force 2>&1 | tail -5
          cd /tmp/saf/Claritas
          xcodebuild -scheme Claritas -configuration Debug CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO build > /tmp/xb.log 2>&1 || true
          grep -E "error:|\*\* BUILD" /tmp/xb.log | sort -u | head
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Debug/Claritas.app" -maxdepth 6 | head -1); echo "APP=$APP"
          mkdir -p ~/Applications && cp -R "$APP" ~/Applications/ && open ~/Applications/Claritas.app && sleep 5 || true
          pluginkit -mAvv -p com.apple.Safari.web-extension | head -8 || true
      - name: Enable safaridriver + unsigned extensions + extension
        run: |
          sudo safaridriver --enable || true
          for d in com.apple.Safari com.apple.Safari.SandboxBroker; do
            defaults write $d AllowUnsignedExtensions -bool true || true
            defaults write $d ExtensionsEnabled -bool true || true
          done
          defaults write ~/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari AllowUnsignedExtensions -bool true || true
          ID=$(pluginkit -mAv -p com.apple.Safari.web-extension | grep -i claritas | head -1 | awk '{print $1}' | tr -d '+-'); echo "ext id: $ID"
          [ -n "$ID" ] && pluginkit -e use -i "$ID" || true
          pluginkit -mAvv -p com.apple.Safari.web-extension | grep -iA3 claritas | head -10 || true
      - name: Enable the extension in real Safari through UI scripting
        continue-on-error: true
        run: |
          osascript -e 'tell application "Safari" to quit' 2>/dev/null || true; sleep 2
          for d in com.apple.Safari "$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari"; do
            defaults write "$d" IncludeDevelopMenu -bool true || true
            defaults write "$d" WebKitDeveloperExtrasEnabledPreferenceKey -bool true || true
            defaults write "$d" "com.apple.Safari.ContentPageGroupIdentifier.WebKit2DeveloperExtrasEnabled" -bool true || true
          done
          open -a Safari; sleep 6
          cat > /tmp/enable.applescript <<'AS'
          tell application "System Events"
            tell process "Safari"
              set frontmost to true
              delay 1
              log "menus: " & (name of every menu bar item of menu bar 1 as string)
              try
                click menu item 1 of menu "Safari" of menu bar item "Safari" of menu bar 1
              end try
              try
                log "safari menu: " & (name of every menu item of menu "Safari" of menu bar item "Safari" of menu bar 1 as string)
                click (first menu item of menu "Safari" of menu bar item "Safari" of menu bar 1 whose name starts with "Settings")
                delay 3
              on error e
                log "ERR open settings: " & e
              end try
              log "windows: " & (name of every window as string)
              try
                log "toolbar: " & (name of every button of toolbar 1 of window 1 as string)
              on error e
                log "ERR toolbar: " & e
              end try
              try
                click button "Advanced" of toolbar 1 of window 1
                delay 2
                log "adv: " & (name of every checkbox of group 1 of window 1 as string)
                try
                  click (first checkbox of group 1 of window 1 whose name contains "web developers")
                  delay 2
                end try
                log "menus after: " & (name of every menu bar item of menu bar 1 as string)
              on error e
                log "ERR adv: " & e
              end try
              try
                click button "Extensions" of toolbar 1 of window 1
                delay 3
                log "ext elements: " & (description of every UI element of window 1 as string)
                log "ext group1: " & (name of every UI element of group 1 of window 1 as string)
                log "ext table: " & (name of every UI element of (first scroll area of group 1 of window 1) as string)
              on error e
                log "ERR ext: " & e
              end try
              try
                log "develop: " & (name of every menu item of menu "Develop" of menu bar item "Develop" of menu bar 1 as string)
                click menu item "Allow Unsigned Extensions" of menu "Develop" of menu bar item "Develop" of menu bar 1
                delay 3
                log "after unsigned windows: " & (name of every window as string)
                log "after unsigned buttons: " & (name of every button of window 1 as string)
              on error e
                log "ERR develop: " & e
              end try
            end tell
          end tell
          AS
          osascript /tmp/enable.applescript 2>&1 | head -60
          mkdir -p test/results && screencapture -x test/results/safari-settings.png || true
          defaults read "$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari" 2>/dev/null | grep -iE "unsigned|extension|Develop" | head
      - name: Screenshot of the desktop
        if: always()
        run: mkdir -p test/results && screencapture -x test/results/safari-desktop.png || true
      - name: Selenium on real Safari
        run: |
          cat > /tmp/saf.py <<'PY'
          import threading, time, re, sys
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from selenium import webdriver
          PAGE = '<!doctype html><html><head><meta charset=utf-8><title>T</title></head><body><p id="p" style="color:#bbb;background:#fff">Text pal</p></body></html>'
          class H(BaseHTTPRequestHandler):
              def do_GET(s): s.send_response(200); s.send_header('Content-Type','text/html'); s.end_headers(); s.wfile.write(PAGE.encode())
              def log_message(s,*a): pass
          threading.Thread(target=ThreadingHTTPServer(('127.0.0.1',8781),H).serve_forever,daemon=True).start()
          d = webdriver.Safari(); print('Safari', d.capabilities.get('browserVersion'))
          d.get('http://127.0.0.1:8781/'); time.sleep(4)
          c = d.execute_script("return getComputedStyle(document.getElementById('p')).color")
          print('PASS Safari real pornit și pagina încărcată'); print(('PASS ' if c != 'rgb(187, 187, 187)' else 'INFO ') + 'extensia a corectat contrastul în Safari real:' , c)
          d.quit()
          PY
          python /tmp/saf.py 2>&1 | tail -12
      - name: Screenshot after test
        if: always()
        run: mkdir -p test/results && screencapture -x test/results/safari-after.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-safari-real, path: test/results }

  ocr-module:
    name: modul OCR local (Chromium)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install playwright pillow imageio-ffmpeg && python -m playwright install chromium ffmpeg
      - run: bash tools/fetch_ocr.sh
      - run: python build.py && mkdir dist/chromium-ocr-unz && unzip -q dist/claritas-chromium-ocr.zip -d dist/chromium-ocr-unz
      - name: Teste module opționale (inclusiv OCR)
        env: { BROWSER_CHANNEL: chromium }
        run: python test/run_matrix.py ocr-module t13_modules.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-ocr-module, path: test/results }

  ci-mode:
    name: mod CI (tools/claritas_ci.py)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: pagină bună → cod 0, pagină proastă → cod 1, rapoarte scrise
        run: |
          mkdir -p test/results
          python tools/claritas_ci.py test/ci_good.html --format all --out /tmp/rep-good --max-errors 0 | tee test/results/ci-good.txt
          set +e; python tools/claritas_ci.py test/ci_bad.html --format all --out /tmp/rep-bad --max-errors 0 | tee test/results/ci-bad.txt; RC=$?; set -e
          [ "$RC" = 1 ] || { echo "FAIL: pagina proastă trebuia să dea cod 1, a dat $RC"; echo "FAIL ci-mode rc=$RC" > test/results/ci-mode-FAIL.txt; exit 1; }
          for f in /tmp/rep-good/*.json /tmp/rep-bad/*.html /tmp/rep-bad/*.csv; do test -s "$f" || { echo "FAIL: lipsește $f"; exit 1; }; done
          python - <<'PY'
          import json,glob
          g=json.load(open(glob.glob('/tmp/rep-good/*.json')[0])); b=json.load(open(glob.glob('/tmp/rep-bad/*.json')[0]))
          assert g['summary']['errors']==0, g['summary']
          assert b['summary']['errors']>=4 and any(i['wcag']=='1.1.1' for i in b['issues']), b['summary']
          print('OK ci-mode: bun 0 erori, prost', b['summary']['errors'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: r-ci-mode, path: test/results }

  publish:
    needs: [ci-mode, ocr-module, lint, chromium-family, firefox, engines, safari-convert, samsung-emulation, chrome-for-testing, browser-profiles, firefox-android, ios-ipados, safari-real]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: collected }
      - name: Push results to ci-results
        run: |
          mkdir -p /tmp/out && cp -r collected/*/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-results && git rm -rf . >/dev/null
          mkdir -p run-${{ github.run_number }} && cp -r /tmp/out/* run-${{ github.run_number }}/ || true
          git add -A && git commit -m "results run ${{ github.run_number }} (${{ github.sha }})" && git push -f origin ci-results
      - name: Verdict (eșuează dacă un test a picat sau nu a rulat)
        if: always()
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = []; exp = []
          EXPERIMENTAL = ('ubuntu-latest-opera.json', 'ubuntu-latest-vivaldi.json')  # CDP în browsere branded: neverificate, raportate separat
          for f in sorted(glob.glob('collected/*/*.json')):
              try: d = json.load(open(f))
              except Exception: continue
              if not isinstance(d, dict): continue
              for k, v in d.items():
                  if isinstance(v, dict) and 'rc' in v and (v.get('fail') or v.get('rc') != 0):
                      (exp if f.endswith(EXPERIMENTAL) else bad).append(f"{f.split('/')[-1]}:{k} fail={v.get('fail')} rc={v.get('rc')}")
          if exp: print('EXPERIMENTAL (neverificat, nu blochează):', len(exp), 'fișiere de test pentru Opera/Vivaldi')
          print('\n'.join(bad) or 'toate verificările au trecut')
          sys.exit(1 if bad else 0)
          PY
