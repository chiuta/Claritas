name: pages
# Copiază site/ pe ramura gh-pages (Pages: Deploy from a branch → gh-pages / root).
on:
  push:
    branches: [ci/browser-matrix]
    paths: ['site/**', 'install/**', 'extension/**', 'manifests/**', 'build.py', 'modules-src/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Construiește pachetele pentru descărcare directă
        run: |
          bash tools/fetch_vendor.sh
          python build.py
          mkdir -p site/download
          cp dist/claritas-chromium.zip dist/claritas-firefox.zip dist/claritas-safari-source.zip site/download/
          for v in axe pdf; do for f in chromium firefox; do cp dist/claritas-$f-$v.zip site/download/; done; done
          cp install/install.sh install/install.ps1 site/download/
          (cd site/download && sha256sum *.zip > SHA256SUMS && ls -la)
          # fiecare link de descărcare din pagină trebuie să existe
          for f in $(grep -oE '(href|src)="(download|video)/[^"]*"' site/index.html | sed -E 's/^(href|src)="//;s/"$//' | sort -u); do test -f "site/$f" || { echo "LIPSEȘTE site/$f"; exit 1; }; done
      - name: Publică site/ pe gh-pages
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r site/. /tmp/pub/ && touch /tmp/pub/.nojekyll
          cd /tmp/pub && git init -q -b gh-pages
          git config user.name "Alexio" && git config user.email "alexio@trom.tf"
          git add -A && git commit -q -m "site: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
