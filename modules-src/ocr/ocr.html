<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claritas — OCR local</title>
<style>
  :root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif}
  body{max-width:52rem;margin:1.5rem auto;padding:0 1rem}
  h1{font-size:1.4rem} fieldset{margin:1rem 0;border:1px solid #888;border-radius:6px}
  #drop{border:2px dashed #888;border-radius:8px;padding:1.5rem;text-align:center}
  #drop.over{background:rgba(120,120,255,.15)}
  button,select{font:inherit;padding:.4rem .8rem;margin:.2rem}
  textarea{width:100%;min-height:14rem;font:inherit;box-sizing:border-box}
  img{max-width:100%;max-height:18rem}
  progress{width:100%}
  :focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1 id="ttl"></h1>
<p id="priv"></p>
<div id="drop" tabindex="0" role="button" aria-describedby="priv">
  <p id="dropT"></p>
  <input type="file" id="file" accept="image/*">
</div>
<p><label for="lang" id="langL"></label> <select id="lang"></select>
<button type="button" id="run" disabled></button></p>
<p><img id="prev" alt="" hidden></p>
<progress id="prog" max="1" value="0" hidden></progress>
<p id="status" role="status" aria-live="polite"></p>
<label for="out" id="outL"></label>
<textarea id="out" readonly></textarea>
<p><button type="button" id="copy"></button><button type="button" id="read"></button><button type="button" id="save"></button></p>
</main>
<script src="shared.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script src="ocr.js"></script>
</body>
</html>
