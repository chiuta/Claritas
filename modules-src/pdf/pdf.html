<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claritas PDF</title>
<style>
@font-face{font-family:'Atkinson Hyperlegible';src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2)}
@font-face{font-family:Lexend;src:url(fonts/lexend-latin-400-normal.woff2)}
@font-face{font-family:OpenDyslexic;src:url(fonts/opendyslexic-latin-400-normal.woff2)}
</style>
<style>
:root{--bg:#fff;--fg:#111;--ac:#0b3d91;--bd:#555}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 system-ui,sans-serif}
body.dark{--bg:#121212;--fg:#f2f2f2;--ac:#8ab4ff;--bd:#aaa}body.sepia{--bg:#f6ecd5;--fg:#2b2112;--ac:#5a3c00}body.yellow{--bg:#ffef9a;--fg:#000;--ac:#003a8c}
header{padding:12px 16px;border-bottom:2px solid var(--bd)}h1{font-size:1.3rem;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input[type=search],input[type=number],input[type=range]{font-size:1rem;padding:6px 10px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{cursor:pointer}:focus-visible{outline:4px solid #ffbf00;outline-offset:2px}
.wrap{display:flex;gap:18px;align-items:flex-start;padding:16px}nav{flex:0 0 260px;max-width:30vw;position:sticky;top:8px;max-height:92vh;overflow:auto;border:2px solid var(--bd);border-radius:10px;padding:8px}
nav ul{list-style:none;padding-left:14px;margin:4px 0}nav a{color:var(--ac)}nav[hidden]{display:none}
main{flex:1;min-width:0;max-width:46em;margin:0 auto}
section.pg{margin:0 0 28px;padding-top:6px;border-top:1px dashed var(--bd)}section.pg>h2{font-size:.95rem;font-weight:600;color:var(--ac)}
p.seg{margin:0 0 .9em}p.seg.cur{outline:3px solid #ffbf00;background:rgba(255,191,0,.18)}mark{background:#ffbf00;color:#000}
#status{min-height:1.5em;margin:6px 0;font-weight:600}.drop{border:3px dashed var(--bd);border-radius:12px;padding:24px;text-align:center}
@media(max-width:700px){.wrap{display:block}nav{max-width:none;position:static}}
</style></head><body>
<header><h1 id="ttl" data-i18n="pdf_title"></h1>
<div class="bar" role="toolbar">
<label><span data-i18n="pdf_choose"></span> <input type="file" id="f" accept="application/pdf,.pdf"></label>
<label><span data-i18n="pdf_theme"></span> <select id="th"><option value="">Light</option><option value="dark">Dark</option><option value="sepia">Sepia</option><option value="yellow">Yellow</option></select></label>
<label><span data-i18n="pdf_fs"></span> <input type="range" id="fs" min="14" max="40" value="18"></label>
<label><span data-i18n="pdf_lh"></span> <input type="range" id="lh" min="12" max="26" value="17"></label>
<label><span data-i18n="pdf_font"></span> <select id="ff"><option value="">System</option><option value="'Atkinson Hyperlegible',system-ui">Atkinson Hyperlegible</option><option value="Lexend,system-ui">Lexend</option><option value="OpenDyslexic,system-ui">OpenDyslexic</option></select></label>
<label><span data-i18n="pdf_search"></span> <input type="search" id="q"></label>
<button type="button" id="go" data-i18n="pdf_read"></button><button type="button" id="stop" data-i18n="pdf_stop"></button>
<button type="button" id="sv" data-i18n="pdf_save"></button>
</div><p id="status" role="status" aria-live="polite"></p></header>
<div class="wrap"><nav id="nav" aria-labelledby="nh" hidden><h2 id="nh" style="font-size:1rem;margin:0" data-i18n="pdf_outline"></h2><ul id="ol"></ul></nav>
<main id="m" tabindex="-1"><div class="drop" id="drop" data-i18n="pdf_drop"></div></main></div>
<script src="shared.js"></script>
<script type="module" src="pdf.js"></script>
</body></html>
